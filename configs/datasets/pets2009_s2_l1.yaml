camera:
  id: "pets2009_s2_l1_view001"
  resolution:
    width: 768
    height: 576
  fps: 25

calibration:
  method: "DLT"
  reprojection_tolerance_m: 0.05
  points:
    image:
      - [80.0, 540.0]     # Point 1: bottom-left
      - [700.0, 540.0]    # Point 2: bottom-right
      - [540.0, 180.0]    # Point 3: top-right
      - [220.0, 180.0]    # Point 4: top-left
    world:
      - [0.0, 0.0]        # Point 1: bottom-left (meters)
      - [12.0, 0.0]       # Point 2: bottom-right
      - [12.0, 20.0]      # Point 3: top-right
      - [0.0, 20.0]       # Point 4: top-left

zones:
  name: "PETSCrowdSafetyZone"
  danger_polygon:
    - [3.0, 4.0]
    - [9.0, 4.0]
    - [9.0, 12.0]
    - [3.0, 12.0]
  warning_polygon:
    - [2.0, 3.0]
    - [10.0, 3.0]
    - [10.0, 13.0]
    - [2.0, 13.0]
  hysteresis_buffer_m: 0.20
  n_confirm: 3
  n_release: 5
  dwell_warning_s: 3.0
  dwell_violation_s: 6.0
  iso_k_speed: 1.6
