camera:
  id: "openvino_people"
  resolution:
    width: 1920
    height: 1080
  fps: 30

calibration:
  method: "DLT"
  reprojection_tolerance_m: 0.05
  points:
    image:
      - [300.0, 950.0]    # Point 1: bottom-left
      - [1620.0, 950.0]   # Point 2: bottom-right
      - [1350.0, 420.0]   # Point 3: top-right
      - [570.0, 420.0]    # Point 4: top-left
    world:
      - [0.0, 0.0]        # Point 1: bottom-left (meters)
      - [8.0, 0.0]        # Point 2: bottom-right
      - [8.0, 12.0]       # Point 3: top-right
      - [0.0, 12.0]       # Point 4: top-left

zones:
  name: "MallWalkwaySafetyZone"
  danger_polygon:
    - [2.0, 2.0]
    - [6.0, 2.0]
    - [6.0, 8.0]
    - [2.0, 8.0]
  warning_polygon:
    - [1.5, 1.5]
    - [6.5, 1.5]
    - [6.5, 8.5]
    - [1.5, 8.5]
  hysteresis_buffer_m: 0.20
  n_confirm: 3
  n_release: 5
  dwell_warning_s: 4.0
  dwell_violation_s: 8.0
  iso_k_speed: 1.6
