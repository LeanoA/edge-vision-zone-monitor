camera:
  id: "mendeley_industrial_cctv"
  resolution:
    width: 1920
    height: 1080
  fps: 24

calibration:
  method: "DLT"
  reprojection_tolerance_m: 0.05
  points:
    image:
      - [250.0, 1020.0]   # Point 1: bottom-left
      - [1680.0, 1020.0]  # Point 2: bottom-right
      - [1400.0, 480.0]   # Point 3: top-right
      - [520.0, 480.0]    # Point 4: top-left
    world:
      - [0.0, 0.0]        # Point 1: bottom-left (meters)
      - [10.0, 0.0]       # Point 2: bottom-right
      - [10.0, 15.0]      # Point 3: top-right
      - [0.0, 15.0]       # Point 4: top-left

zones:
  name: "FactoryMachineRestrictedZone"
  danger_polygon:
    - [2.5, 3.0]
    - [7.5, 3.0]
    - [7.5, 10.0]
    - [2.5, 10.0]
  warning_polygon:
    - [1.8, 2.2]
    - [8.2, 2.2]
    - [8.2, 10.8]
    - [1.8, 10.8]
  hysteresis_buffer_m: 0.20
  n_confirm: 3
  n_release: 5
  dwell_warning_s: 3.0
  dwell_violation_s: 6.0
  iso_k_speed: 1.6
