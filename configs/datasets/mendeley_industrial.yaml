camera:
  id: "mendeley_industrial_cctv"
  resolution:
    width: 1920
    height: 1080
  fps: 24

calibration:
  method: "DLT"
  reprojection_tolerance_m: 0.05
  points:
    image:
      - [100.0, 1020.0]   # Point 1: bottom-left (press bay left edge)
      - [1684.0, 1020.0]  # Point 2: bottom-right (green walkway inner yellow border)
      - [1515.0, 420.0]   # Point 3: top-right (green walkway inner yellow border, far corridor)
      - [320.0, 420.0]    # Point 4: top-left (rear press bay boundary)
    world:
      - [0.0, 0.0]        # Point 1: bottom-left (meters)
      - [10.0, 0.0]       # Point 2: bottom-right
      - [10.0, 15.0]      # Point 3: top-right
      - [0.0, 15.0]       # Point 4: top-left

zones:
  name: "FactoryMachineRestrictedZone"
  far_field_roi: [1320, 200, 1700, 580]
  far_field_conf_threshold: 0.30
  danger_polygon:
    - [0.0, 0.0]
    - [9.8, 0.0]
    - [9.8, 23.0]
    - [0.0, 23.0]
  warning_polygon:
    - [-0.2, -0.2]
    - [10.0, -0.2]
    - [10.0, 23.2]
    - [-0.2, 23.2]
  hysteresis_buffer_m: 0.20
  n_confirm: 3
  n_release: 5
  dwell_warning_s: 3.0
  dwell_violation_s: 6.0
  iso_k_speed: 1.6
