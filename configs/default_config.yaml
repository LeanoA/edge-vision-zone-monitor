camera:
  id: "industrial_cam_01"
  resolution:
    width: 1920
    height: 1080
  fps: 30

calibration:
  method: "DLT"
  reprojection_tolerance_m: 0.05
  points:
    image:
      - [480.0, 920.0]    # Point 1: bottom-left
      - [1440.0, 920.0]   # Point 2: bottom-right
      - [1200.0, 480.0]   # Point 3: top-right
      - [720.0, 480.0]    # Point 4: top-left
    world:
      - [0.0, 0.0]        # Point 1: bottom-left (meters)
      - [4.0, 0.0]        # Point 2: bottom-right
      - [4.0, 6.0]        # Point 3: top-right
      - [0.0, 6.0]        # Point 4: top-left
